# =====================================================================
# 父子分块 RAG 检索系统 —— 全部依赖服务的统一编排
#
# 一条命令启动本项目所需的全部 5 个服务（MySQL / Redis / etcd / MinIO / Milvus）：
#     docker compose up -d
#
# 查看状态：  docker compose ps
# 停止：      docker compose stop
# 移除容器：  docker compose down          （保留数据卷）
# 连同数据：  docker compose down -v       （⚠ 删除卷，数据不可恢复）
#
# 端口分配（宿主机）：
#     9999  -> MySQL 3306      （避开本机既有的 3306 占用）
#     6379  -> Redis 6379
#     19530 -> Milvus gRPC
#     9091  -> Milvus 健康检查 / metrics
#     9000  -> MinIO S3 API
#     9001  -> MinIO 控制台
#     etcd 2379 仅在容器网络内暴露，不映射到宿主机
#
# 与 .env 的对应关系（必须保持一致，否则应用连不上）：
#     MYSQL_HOST/PORT     -> 127.0.0.1:9999
#     REDIS_HOST/PORT     -> 127.0.0.1:6379
#     MILVUS_URI/TOKEN    -> http://localhost:19530 + root:123456
# =====================================================================
name: par_sub_split

services:
  # ---------------------- MySQL：父文档持久层 ----------------------
  mysql:
    image: mysql:8.4
    container_name: par_sub_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: par_sub_split
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 宿主机 9999 -> 容器 3306（刻意避开默认 3306，防止与本机其他 MySQL 冲突）
      - "9999:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------------------- Redis：父文档内容缓存 ----------------------
  redis:
    image: redis:8
    container_name: par_sub_redis
    restart: unless-stopped
    # appendonly：缓存内容可从 MySQL 重建，但开启 AOF 可避免重启后缓存冷启动
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------- 以下为 Milvus 单机版的依赖组件 ----------------------
  # Milvus standalone 需要 etcd（元数据）+ MinIO（对象存储）两个外部依赖
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    container_name: par_sub_etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir
      - /etcd
    volumes:
      - etcd_data:/etcd
    # 说明：etcd 只需「容器已启动」即可，Milvus 自身带连接重试，
    # 因此这里不配 healthcheck，避免因 etcdctl 缺失导致 unhealthy 反而阻塞 Milvus。

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: par_sub_minio
    restart: unless-stopped
    environment:
      # 新版本使用 MINIO_ROOT_USER/PASSWORD；旧的 MINIO_ACCESS_KEY/SECRET_KEY 已废弃
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    ports:
      - "9000:9000"   # S3 API（Milvus 通过容器网络 minio:9000 访问）
      - "9001:9001"   # 控制台 http://127.0.0.1:9001
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v3.0.0
    container_name: par_sub_milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # 开启鉴权：客户端需携带 token（.env 中 MILVUS_TOKEN=root:123456）
      COMMON_SECURITY_AUTHORIZATIONENABLED: "true"
      COMMON_SECURITY_DEFAULTROOTPASSWORD: "123456"
    ports:
      - "19530:19530"  # gRPC
      - "9091:9091"    # healthz / metrics
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 5

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  minio_data:
  milvus_data:
